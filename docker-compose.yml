services:
  chatgpt-web-api:
    build: .
    ports:
      - "7860:7860"
    environment:
      PORT: "7860"
      PYTHONUNBUFFERED: "1"
      API_SECRET_KEY: "${API_SECRET_KEY:?Set API_SECRET_KEY}"
      CHATGPT_COOKIES_NETSCAPE: "${CHATGPT_COOKIES_NETSCAPE:?Set CHATGPT_COOKIES_NETSCAPE}"
      CHATGPT_HEADLESS: "${CHATGPT_HEADLESS:-true}"
      CHATGPT_READY_TIMEOUT: "${CHATGPT_READY_TIMEOUT:-180}"
      CHATGPT_REQUEST_TIMEOUT: "${CHATGPT_REQUEST_TIMEOUT:-210}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-20}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
